[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-cli"
version = "0.1.0"
description = "Coffee CLI"
requires-python = ">=3.11"
dependencies = ["platformdirs"]

authors = [
    { name = "Quitto" }
]

license = { file = "LICENSE" }
readme = "README.md"

[project.scripts]
coffee = "coffee.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/QuittoGames/CoffeeCLI"
Repository = "https://github.com/QuittoGames/CoffeeCLI"
Issues = "https://github.com/QuittoGames/CoffeeCLI/issues"
